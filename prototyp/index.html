<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1c">
<title>Barrel Ninja — Steuerung</title>
<link rel="icon" href="../icons/icon-192.png">
<style>
  @font-face { font-family:'PS2P'; src:url(../fonts/press-start-2p.woff) format('woff'); font-weight:400; font-display:swap; }
  html, body { margin:0; height:100%; background:#05070F; overflow:hidden; overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas { touch-action:none; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #sat,#sab,#sal,#sar { position:fixed; pointer-events:none; z-index:-1; }
  #sat { left:0; top:0; height:env(safe-area-inset-top); width:0; }
  #sab { left:0; bottom:0; height:env(safe-area-inset-bottom); width:0; }
  #sal { left:0; top:0; width:env(safe-area-inset-left); height:0; }
  #sar { right:0; top:0; width:env(safe-area-inset-right); height:0; }
</style>
</head>
<body>
<canvas id="c" width="390" height="844"></canvas>
<div id="sat"></div><div id="sab"></div><div id="sal"></div><div id="sar"></div>
<script src="../vfx/vfx.js"></script>
<script src="../vfx/ninja-anim.js"></script>
<script src="game.js"></script>
</body>
</html>
